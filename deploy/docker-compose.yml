services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinicius}
      POSTGRES_USER: ${POSTGRES_USER:-vinicius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinicius} -d ${POSTGRES_DB:-vinicius}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinicius}
      POSTGRES_USER: ${POSTGRES_USER:-vinicius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WA_BRIDGE_URL: http://wa-bridge:3100
      VM_STORE_PATH: /app/data/store.json
    volumes:
      - ../data:/app/data
      - ../web:/app/web:ro
      - ../wa-bridge/auth:/app/wa-bridge/auth
    depends_on:
      db:
        condition: service_healthy

  wa-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.wa
    restart: unless-stopped
    environment:
      WA_BRIDGE_PORT: "3100"
      VM_API: http://web:8000
    volumes:
      - ../wa-bridge/auth:/app/wa-bridge/auth
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web:/app/web:ro
      - staticfiles:/app/backend/staticfiles:ro
    depends_on:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles: ["cloudflare"]

volumes:
  pgdata:
  staticfiles:
